services:
  postgres:
    image: postgres:16
    container_name: tripare-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: tripare
      POSTGRES_USER: tripare_user
      POSTGRES_PASSWORD: tripare_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripare_user -d tripare"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
