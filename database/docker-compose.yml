services:
  postgres:
    image: postgres:16
    container_name: tripare-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: tripare
      POSTGRES_USER: tripare_user
      POSTGRES_PASSWORD: tripare_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
      - ./seed/001_seed_data.sql:/docker-entrypoint-initdb.d/002_seed_data.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripare_user -d tripare"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
